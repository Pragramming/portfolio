services:
  - type: web
    name: jayesh-learning-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 server:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LEARNING_DB_PATH
        value: /tmp/learning.sqlite3
      - key: LEARNING_COOKIE_SECURE
        value: "1"
      - key: LEARNING_SECRET_KEY
        generateValue: true
      - key: LEARNING_LOGIN_PASSWORD
        sync: false
